name: Compare textured map fragments with full NeoParadise map

on:
  push:
    paths:
      - ".github/workflows/compare-textured-map-fragments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and archive tools
        run: sudo apt-get update && sudo apt-get install -y blender unzip libegl1
      - name: Recursively extract source models
        run: |
          mkdir -p /tmp/compare/full /tmp/compare/fragment audit
          python3 - <<'PY'
          import zipfile,io,pathlib
          def extract(raw,dest,depth=0):
            if depth>5: return
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for info in z.infolist():
                if info.is_dir(): continue
                data=z.read(info.filename)
                name=pathlib.Path(info.filename)
                if name.suffix.lower()=='.zip':
                  extract(data,dest/name.stem,depth+1)
                else:
                  out=dest/name
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          extract(pathlib.Path('free-fire-ful-map.zip').read_bytes(),pathlib.Path('/tmp/compare/full'))
          extract(pathlib.Path('free-fire-burmuda-map-the-circuit-3d-model.zip').read_bytes(),pathlib.Path('/tmp/compare/fragment'))
          PY
      - name: Render textured models and compare landmarks
        run: |
          cat > /tmp/textured.py <<'PY'
          import bpy, pathlib, json, math
          from mathutils import Vector
          root=pathlib.Path('/tmp/compare')
          blend=next((root/'full').rglob('*.blend'))
          obj=max((root/'fragment').rglob('*.obj'),key=lambda p:p.stat().st_size)
          mtl_name=next((line.split(maxsplit=1)[1].strip().strip('"') for line in obj.read_text(errors='ignore').splitlines() if line.lower().startswith('mtllib ')),None)
          mtls=list((root/'fragment').rglob('*.mtl'))
          mtl=next((p for p in mtls if mtl_name and p.name==pathlib.Path(mtl_name).name),None)
          if mtl:
            model_dir=obj.parent
            for tex in (root/'fragment').rglob('*'):
              if tex.is_file() and tex.suffix.lower() in ('.png','.jpg','.jpeg','.tga'):
                target=model_dir/tex.name
                if not target.exists(): target.write_bytes(tex.read_bytes())
            expected=obj.parent/pathlib.Path(mtl_name).name
            if expected!=mtl: expected.write_bytes(mtl.read_bytes())
            lines=[]
            for line in expected.read_text(errors='ignore').splitlines():
              if line.lower().startswith(('map_kd ','map_ka ','map_ks ','map_bump ','bump ')):
                parts=line.split()
                if len(parts)>1: line=parts[0]+' '+pathlib.Path(parts[-1]).name
              lines.append(line)
            expected.write_text('\\n'.join(lines)+'\\n')
          def import_obj():
            if hasattr(bpy.ops.wm,'obj_import'): bpy.ops.wm.obj_import(filepath=str(obj))
            else: bpy.ops.import_scene.obj(filepath=str(obj))
          def setup_camera(scene,center,span,path):
            camdata=bpy.data.cameras.new('AuditCamera'); cam=bpy.data.objects.new('AuditCamera',camdata); scene.collection.objects.link(cam)
            cam.location=(center.x,center.y,center.z+span*2.0); cam.rotation_euler=(0,0,0)
            cam.data.type='ORTHO'; cam.data.ortho_scale=span; scene.camera=cam
            # Render with Eevee so MTL image textures are actually visible.
            # Ubuntu's apt Blender may be 3.x (BLENDER_EEVEE) or 4.x (EEVEE_NEXT).
            scene.render.engine='BLENDER_EEVEE_NEXT' if bpy.app.version >= (4,2,0) else 'BLENDER_EEVEE'
            scene.render.resolution_x=1500; scene.render.resolution_y=1200; scene.render.resolution_percentage=100
            scene.render.image_settings.file_format='PNG'
            scene.view_settings.view_transform='Standard'
            if scene.world is None: scene.world=bpy.data.worlds.new('AuditWorld')
            scene.world.color=(0.18,0.18,0.18)
            light_data=bpy.data.lights.new('AuditArea','AREA'); light_data.energy=span*span*18
            light=bpy.data.objects.new('AuditArea',light_data); scene.collection.objects.link(light)
            light.location=(center.x-span*0.15,center.y+span*0.15,center.z+span*1.5)
            light.rotation_euler=(0,0,0); light_data.shape='DISK'; light_data.size=span*1.5
            scene.render.image_settings.file_format='PNG'; scene.render.filepath=str(path)
            bpy.ops.render.render(write_still=True)
          # Render complete white-map source as delivered, preserving all original materials.
          bpy.ops.wm.open_mainfile(filepath=str(blend))
          full=[o for o in bpy.context.scene.objects if o.type=='MESH']
          def bounds(objects):
            pts=[o.matrix_world @ Vector(c) for o in objects for c in o.bound_box]
            return {'min':[min(p[i] for p in pts) for i in range(3)],'max':[max(p[i] for p in pts) for i in range(3)]}
          fb=bounds(full)
          fc=Vector([(fb['min'][i]+fb['max'][i])/2 for i in range(3)])
          fs=max(fb['max'][0]-fb['min'][0],fb['max'][1]-fb['min'][1])*1.18
          scene=bpy.context.scene
          setup_camera(scene,fc,fs,'audit/full-map-textured-source.png')
          # Render candidate textured fragment using the same coordinates and scale.
          bpy.ops.wm.read_factory_settings(use_empty=True)
          import_obj()
          frag=[o for o in bpy.context.scene.objects if o.type=='MESH']
          # Ignore the giant backdrop/wall plane and retain map content inside full-map footprint.
          for o in frag:
            if o.name.startswith('Plane.003_Plane'): o.hide_render=True
          scene=bpy.context.scene
          setup_camera(scene,fc,fs,'audit/fragment-textured-source.png')
          # Also render a combined overlay with full map in neutral translucent grey and fragment in its native materials.
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.wm.open_mainfile(filepath=str(blend))
          full=[o for o in bpy.context.scene.objects if o.type=='MESH']
          for o in full:
            mat=bpy.data.materials.new('BaseMapNeutral')
            mat.diffuse_color=(0.55,0.58,0.62,0.35)
            mat.surface_render_method='DITHERED'
            o.data.materials.clear(); o.data.materials.append(mat)
          import_obj()
          frag=[o for o in bpy.context.scene.objects if o.type=='MESH' and o not in full]
          for o in frag:
            if o.name.startswith('Plane.003_Plane'): o.hide_render=True
          scene=bpy.context.scene
          setup_camera(scene,fc,fs,'audit/combined-textured-overlay.png')
          report={'full_map_bounds':fb,'full_map_dimensions':[round(fb['max'][i]-fb['min'][i],3) for i in range(3)],'fragment_meshes':len(frag),'fragment_textured_materials':sum(1 for m in bpy.data.materials if m.use_nodes and any(n.type=='TEX_IMAGE' for n in m.node_tree.nodes)),'fragment_mesh_bounds':[]}
          for o in frag:
            b=bounds([o])
            report['fragment_mesh_bounds'].append({'name':o.name,'vertices':len(o.data.vertices),'bounds':b})
          pathlib.Path('audit/textured-comparison.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          blender -b --python /tmp/textured.py
      - name: Upload textured comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-textured-landmark-comparison
          path: audit/
          if-no-files-found: error
          retention-days: 14
