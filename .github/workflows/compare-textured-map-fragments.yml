name: Compare textured map fragments with full NeoParadise map

on:
  push:
    paths:
      - ".github/workflows/compare-textured-map-fragments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and archive tools
        run: sudo apt-get update && sudo apt-get install -y blender unzip
      - name: Recursively extract source models
        run: |
          mkdir -p /tmp/compare/full /tmp/compare/fragment audit
          python3 - <<'PY'
          import zipfile,io,pathlib
          def extract(raw,dest,depth=0):
            if depth>5: return
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for info in z.infolist():
                if info.is_dir(): continue
                data=z.read(info)
                name=pathlib.Path(info.filename)
                if name.suffix.lower()=='.zip':
                  extract(data,dest/(name.stem),depth+1)
                else:
                  out=dest/name
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          extract(pathlib.Path('free-fire-ful-map.zip').read_bytes(),pathlib.Path('/tmp/compare/full'))
          extract(pathlib.Path('free-fire-burmuda-map-the-circuit-3d-model.zip').read_bytes(),pathlib.Path('/tmp/compare/fragment'))
          PY
          echo "OBJ files:"; find /tmp/compare/fragment -type f -iname '*.obj'
          echo "MTL files:"; find /tmp/compare/fragment -type f -iname '*.mtl'
          echo "Textures:"; find /tmp/compare/fragment -type f -iname '*.png' | wc -l
          test -n "$(find /tmp/compare/fragment -type f -iname '*.obj' -print -quit)"
      - name: Compare geometry, bounds and render previews
        run: |
          cat > /tmp/compare.py <<'PY'
          import bpy, pathlib, json, math
          from mathutils import Vector
          root=pathlib.Path('/tmp/compare')
          blend=next((root/'full').rglob('*.blend'))
          objs=list((root/'fragment').rglob('*.obj'))
          obj=max(objs,key=lambda p:p.stat().st_size)
          mtls=list((root/'fragment').rglob('*.mtl'))
          mtl=next((p for p in mtls if p.stem==obj.stem),mtls[0] if mtls else None)
          # Repair the OBJ material library's stale absolute texture paths by copying
          # the archive's texture files beside the OBJ using their original names.
          model_dir=obj.parent
          for tex in (root/'fragment').rglob('*'):
            if tex.is_file() and tex.suffix.lower() in ('.png','.jpg','.jpeg','.tga') and tex.parent != model_dir:
              target=model_dir/tex.name
              if not target.exists(): target.write_bytes(tex.read_bytes())
          if mtl and mtl.exists():
            lines=[]
            for line in mtl.read_text(errors='ignore').splitlines():
              if line.lower().startswith(('map_kd ','map_ka ','map_ks ','map_bump ','bump ')):
                parts=line.split()
                if len(parts)>1: line=parts[0]+' '+pathlib.Path(parts[-1]).name
              lines.append(line)
            mtl.write_text('\\n'.join(lines)+'\\n')
          bpy.ops.wm.open_mainfile(filepath=str(blend))
          full=[o for o in bpy.context.scene.objects if o.type=='MESH']
          def bounds(objects):
            pts=[]
            for o in objects:
              for c in o.bound_box: pts.append(o.matrix_world @ Vector(c))
            if not pts: return None
            return {'min':[min(p[i] for p in pts) for i in range(3)],'max':[max(p[i] for p in pts) for i in range(3)]}
          fb=bounds(full)
          if hasattr(bpy.ops.wm,'obj_import'): bpy.ops.wm.obj_import(filepath=str(obj))
          else: bpy.ops.import_scene.obj(filepath=str(obj))
          frag=[o for o in bpy.context.scene.objects if o.type=='MESH' and o not in full]
          mb=bounds(frag)
          def dims(b): return [round(b['max'][i]-b['min'][i],3) for i in range(3)]
          report={'full_map_file':str(blend),'fragment_obj':str(obj),'fragment_mtl':str(mtl) if mtl else None,'obj_candidates':[(str(p),p.stat().st_size) for p in objs],'full_meshes':len(full),'fragment_meshes':len(frag),'full_bounds':fb,'fragment_bounds':mb,'full_dimensions':dims(fb),'fragment_dimensions':dims(mb),'same_coordinate_overlap':None,'texture_count':len(list((root/'fragment').rglob('*.png')))}
          if fb and mb:
            report['same_coordinate_overlap']=[round(max(0,min(fb['max'][i],mb['max'][i])-max(fb['min'][i],mb['min'][i])),3) for i in range(3)]
            report['fragment_center']=[round((mb['min'][i]+mb['max'][i])/2,3) for i in range(3)]
            report['full_center']=[round((fb['min'][i]+fb['max'][i])/2,3) for i in range(3)]
          def object_rows(objects):
            rows=[]
            for o in objects:
              b=bounds([o])
              rows.append({'name':o.name,'vertices':len(o.data.vertices),'faces':len(o.data.polygons),'bounds':b,'dimensions':dims(b)})
            return rows
          report['full_objects']=object_rows(full)
          report['fragment_objects']=object_rows(frag)
          pathlib.Path('audit/geometry-comparison.json').write_text(json.dumps(report,indent=2))
          for o in full:
            mat=bpy.data.materials.new('FullMapNeutral'); mat.diffuse_color=(0.62,0.66,0.68,1); o.data.materials.clear(); o.data.materials.append(mat)
          for o in frag:
            mat=bpy.data.materials.new('FragmentNeutral'); mat.diffuse_color=(0.18,0.42,0.2,1); o.data.materials.clear(); o.data.materials.append(mat)
          scene=bpy.context.scene
          scene.render.engine='BLENDER_WORKBENCH'
          scene.display.shading.light='STUDIO'
          scene.display.shading.color_type='MATERIAL'
          scene.display.shading.show_shadows=True
          scene.display.shading.show_cavity=True
          scene.render.resolution_x=1400; scene.render.resolution_y=1100; scene.render.resolution_percentage=100
          allb=[fb,mb]; mn=[min(b['min'][i] for b in allb) for i in range(3)]; mx=[max(b['max'][i] for b in allb) for i in range(3)]
          center=Vector([(mn[i]+mx[i])/2 for i in range(3)])
          span=max(mx[0]-mn[0],mx[1]-mn[1])*1.15
          camdata=bpy.data.cameras.new('AuditCamera'); cam=bpy.data.objects.new('AuditCamera',camdata); scene.collection.objects.link(cam)
          cam.location=(center.x,center.y,mx[2]+max(100,span)); cam.rotation_euler=(0,0,0); cam.data.type='ORTHO'; cam.data.ortho_scale=span; scene.camera=cam
          for o in scene.objects:
            if o.type=='LIGHT': o.hide_render=True
          bpy.ops.object.light_add(type='AREA', location=(center.x,center.y,mx[2]+span))
          light=bpy.context.object; light.data.energy=5000; light.data.shape='DISK'; light.data.size=span
          scene.render.image_settings.file_format='PNG'
          scene.render.filepath='audit/fragment-overlay-top.png'
          bpy.ops.render.render(write_still=True)
          cam.location=(center.x,mn[1]-span*1.8,center.z); cam.rotation_euler=(math.radians(90),0,0)
          cam.data.ortho_scale=max(mx[0]-mn[0],mx[2]-mn[2])*1.25
          scene.render.resolution_y=900; scene.render.filepath='audit/fragment-overlay-side.png'
          bpy.ops.render.render(write_still=True)
          print(json.dumps(report,indent=2))
          PY
          blender -b --python /tmp/compare.py
      - name: Upload comparison report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-textured-map-fragment-comparison
          path: audit/
          if-no-files-found: error
          retention-days: 14
