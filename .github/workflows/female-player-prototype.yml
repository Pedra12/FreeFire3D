name: Female rigged player prototype audit

on:
  push:
    paths:
      - ".github/workflows/female-player-prototype.yml"
      - "docs/female-player-prototype-trigger.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rigged-female:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Download Quaternius rig and animation sources
        run: |
          git clone --depth 1 https://github.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender.git /tmp/quaternius
          mkdir -p game/assets/characters build
          BASE="/tmp/quaternius/Universal Base Characters[Standard]/Universal Base Characters[Standard]/Base Characters/Godot - UE"
          UAL1="/tmp/quaternius/Universal Animation Library[Standard]/Universal Animation Library[Standard]/Unreal-Godot/UAL1_Standard.glb"
          UAL2="/tmp/quaternius/Universal Animation Library 2[Standard]/Universal Animation Library 2[Standard]/Unreal-Godot/UAL2_Standard.glb"
          cp "$BASE"/* game/assets/characters/
          cp "$UAL1" "$UAL2" game/assets/characters/
          cp /tmp/quaternius/merge/merge.mjs game/assets/characters/
          cp /tmp/quaternius/merge/package.json game/assets/characters/
          cd game/assets/characters
          node -e "let p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm install --no-audit --no-fund
          node - <<'JS'
          const fs=require('fs');
          for (const f of ['Superhero_Female_FullBody.gltf']) {
            const p=JSON.parse(fs.readFileSync(f,'utf8'));
            for (const im of p.images||[]) {
              if (!im.uri) continue;
              const target=im.uri;
              if (!fs.existsSync(target)) {
                const alt=target.replace(/_png(\.[^.]+)$/,'$1');
                if (fs.existsSync(alt)) fs.copyFileSync(alt,target);
              }
            }
          }
          JS
          node merge.mjs Superhero_Female_FullBody.gltf female_player_rigged.glb UAL1_Standard.glb UAL2_Standard.glb | tee "$GITHUB_WORKSPACE/build/merge-report.log"
          test -s female_player_rigged.glb
          cd "$GITHUB_WORKSPACE"
          sha256sum game/assets/characters/female_player_rigged.glb | tee build/female-player-sha256.txt

      - name: Download Godot and import character
        run: |
          mkdir -p tools/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d tools/godot
          GODOT_BIN="$(find tools/godot -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --path game --quit 2>&1 | tee build/godot-import.log
          cat > game/inspect_female_player.gd <<'GD'
          extends SceneTree
          func _initialize():
              var packed = load("res://assets/characters/female_player_rigged.glb") as PackedScene
              if packed == null:
                  push_error("FEMALE_PLAYER_LOAD_FAILED")
                  quit(2)
                  return
              var root = packed.instantiate()
              var report = {"nodes":0,"meshes":0,"skeletons":[],"animation_players":[]}
              _walk(root,report)
              print("FEMALE_PLAYER_REPORT=",JSON.stringify(report))
              var has_skeleton = report["skeletons"].size() > 0
              var has_clips = false
              for ap in report["animation_players"]:
                  if ap["clips"].size() > 0: has_clips = true
              if not has_skeleton or not has_clips:
                  push_error("FEMALE_PLAYER_RIG_OR_ANIMATIONS_MISSING")
                  quit(3)
                  return
              quit(0)
          func _walk(n:Node,r:Dictionary):
              r["nodes"] += 1
              if n is MeshInstance3D: r["meshes"] += 1
              if n is Skeleton3D: r["skeletons"].append({"name":n.name,"bones":n.get_bone_count()})
              if n is AnimationPlayer:
                  var clips=[]
                  for a in n.get_animation_list(): clips.append(a)
                  r["animation_players"].append({"name":n.name,"clips":clips})
              for c in n.get_children(): _walk(c,r)
          GD
          "$GODOT_BIN" --headless --path game --script res://inspect_female_player.gd 2>&1 | tee build/female-player-report.log
          grep "FEMALE_PLAYER_REPORT=" build/female-player-report.log

      - name: Upload rigged player prototype
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-female-rigged-player-prototype
          path: |
            game/assets/characters/female_player_rigged.glb
            build/merge-report.log
            build/female-player-sha256.txt
            build/female-player-report.log
            build/godot-import.log
          if-no-files-found: error
          retention-days: 14
