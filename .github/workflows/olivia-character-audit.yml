name: Olivia character rig audit

on:
  push:
    paths:
      - ".github/workflows/olivia-character-audit.yml"
      - "olivia-free-fire.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-olivia:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender for source-model preview
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Download Godot 4.7.2
        run: |
          mkdir -p tools/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d tools/godot
          GODOT_BIN="$(find tools/godot -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Extract original Olivia model
        run: |
          mkdir -p game/assets/characters build
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json
          zpath=pathlib.Path("olivia-free-fire.zip")
          with zipfile.ZipFile(zpath) as z:
              matches=[n for n in z.namelist() if n.endswith("olivia-free_fire.glb")]
              if len(matches)!=1: raise SystemExit(f"Expected one Olivia GLB: {matches}")
              data=z.read(matches[0])
          out=pathlib.Path("game/assets/characters/olivia.glb")
          out.write_bytes(data)
          pathlib.Path("build/olivia-source.json").write_text(json.dumps({
            "archive":str(zpath),"entry":matches[0],"bytes":len(data),
            "sha256":hashlib.sha256(data).hexdigest()
          },indent=2))
          PY
      - name: Render and inspect the original Olivia mesh before rigging
        run: |
          cat > build/render_olivia.py <<'PY'
          import bpy, json, os
          from mathutils import Vector
          from pathlib import Path
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=os.path.abspath('game/assets/characters/olivia.glb'))
          meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']
          if not meshes: raise SystemExit('OLIVIA_PREVIEW_FAILED: no meshes')
          points=[]
          for obj in meshes:
              points.extend([obj.matrix_world @ Vector(c) for c in obj.bound_box])
          lo=Vector([min(p[i] for p in points) for i in range(3)])
          hi=Vector([max(p[i] for p in points) for i in range(3)])
          center=(lo+hi)*0.5; diagonal=max((hi-lo).length,1.0)
          scene=bpy.context.scene
          cam_data=bpy.data.cameras.new('OliviaAuditCamera'); cam=bpy.data.objects.new('OliviaAuditCamera',cam_data); scene.collection.objects.link(cam)
          cam.location=center+Vector((1.25,-1.8,1.05)).normalized()*diagonal*1.8
          cam.rotation_euler=(center-cam.location).to_track_quat('-Z','Y').to_euler(); cam_data.lens=55; scene.camera=cam
          light_data=bpy.data.lights.new('OliviaAuditKey','AREA'); light=bpy.data.objects.new('OliviaAuditKey',light_data); scene.collection.objects.link(light); light.location=center+Vector((2,-3,4)); light_data.energy=1800; light_data.shape='DISK'; light_data.size=5
          fill_data=bpy.data.lights.new('OliviaAuditFill','AREA'); fill=bpy.data.objects.new('OliviaAuditFill',fill_data); scene.collection.objects.link(fill); fill.location=center+Vector((-3,2,1)); fill_data.energy=700; fill_data.size=4
          scene.render.engine='BLENDER_EEVEE_NEXT'; scene.render.resolution_x=900; scene.render.resolution_y=1200; scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'; scene.render.filepath=os.path.abspath('build/olivia-preview.png')
          bpy.ops.render.render(write_still=True)
          report={'mesh_count':len(meshes),'vertex_count':sum(len(o.data.vertices) for o in meshes),'triangle_count':sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes),'materials':len(bpy.data.materials),'bounds_min':list(lo),'bounds_max':list(hi),'dimensions':list(hi-lo),'armatures':sum(o.type=='ARMATURE' for o in bpy.context.scene.objects),'preview':'build/olivia-preview.png'}
          Path('build/olivia-blender-report.json').write_text(json.dumps(report,indent=2))
          print('OLIVIA_BLENDER_REPORT',json.dumps(report))
          PY
          blender -b -t 2 --python build/render_olivia.py 2>&1 | tee build/olivia-blender.log
          grep OLIVIA_BLENDER_REPORT build/olivia-blender.log
      - name: Import model and inspect rig and animations in isolated Godot project
        run: |
          mkdir -p build/olivia-godot/assets/characters
          cp game/assets/characters/olivia.glb build/olivia-godot/assets/characters/olivia.glb
          cat > build/olivia-godot/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Olivia Rig Audit"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cat > build/olivia-godot/inspect_olivia_audit.gd <<'GD'
          extends SceneTree
          func _initialize():
              var packed = load("res://assets/characters/olivia.glb") as PackedScene
              if packed == null:
                  push_error("OLIVIA_LOAD_FAILED")
                  quit(2)
                  return
              var model = packed.instantiate()
              var report = {"loaded": true, "nodes": 0, "meshes": 0, "vertices": 0, "surfaces": 0, "skinned_meshes": 0, "skeletons": [], "animation_players": [], "animation_trees": 0}
              _walk(model, report)
              print("OLIVIA_RIG_REPORT=", JSON.stringify(report))
              if report["meshes"] == 0:
                  push_error("OLIVIA_HAS_NO_MESHES")
                  quit(3)
                  return
              quit(0)
          func _walk(node: Node, report: Dictionary):
              report["nodes"] += 1
              if node is MeshInstance3D:
                  var mesh_node = node as MeshInstance3D
                  report["meshes"] += 1
                  if mesh_node.mesh:
                      report["surfaces"] += mesh_node.mesh.get_surface_count()
                      for surface in range(mesh_node.mesh.get_surface_count()):
                          var arrays = mesh_node.mesh.surface_get_arrays(surface)
                          if arrays.size() > Mesh.ARRAY_VERTEX and arrays[Mesh.ARRAY_VERTEX] is PackedVector3Array:
                              report["vertices"] += arrays[Mesh.ARRAY_VERTEX].size()
                  if mesh_node.skin != null:
                      report["skinned_meshes"] += 1
              if node is Skeleton3D:
                  report["skeletons"].append({"name":node.name,"bones":node.get_bone_count()})
              if node is AnimationTree:
                  report["animation_trees"] += 1
              if node is AnimationPlayer:
                  var ap = node as AnimationPlayer
                  var anims = []
                  for anim_name in ap.get_animation_list():
                      var anim = ap.get_animation(anim_name)
                      anims.append({"name":anim_name,"length":anim.length,"tracks":anim.get_track_count()})
                  report["animation_players"].append({"name":node.name,"animations":anims})
              for child in node.get_children():
                  _walk(child, report)
          GD
          "$GODOT_BIN" --headless --editor --path build/olivia-godot --quit 2>&1 | tee build/import.log
          "$GODOT_BIN" --headless --path build/olivia-godot --script res://inspect_olivia_audit.gd 2>&1 | tee build/olivia-rig-report.log
          grep "OLIVIA_RIG_REPORT=" build/olivia-rig-report.log
      - name: Upload Olivia rig audit
        uses: actions/upload-artifact@v4
        with:
          name: olivia-character-rig-audit
          path: |
            build/olivia-source.json
            build/import.log
            build/olivia-rig-report.log
            build/olivia-blender-report.json
            build/olivia-blender.log
            build/olivia-preview.png
          if-no-files-found: error
          retention-days: 7
