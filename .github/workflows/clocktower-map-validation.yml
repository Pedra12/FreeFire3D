name: Clocktower map Godot validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/clocktower-map-validation.yml"
      - "tools/convert_clocktower.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xz-utils curl unzip libegl1

      - name: Install Blender 4.5 with package fallback
        run: |
          mkdir -p /opt/blender
          if curl -L --fail --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz; then
            tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          else
            echo "Official Blender archive unavailable; using Ubuntu package"
            ln -sf "$(command -v blender)" /opt/blender/blender
          fi
          /opt/blender/blender --version

      - name: Extract Clocktower source and relink texture directory
        run: |
          mkdir -p build/clocktower/source game/assets/maps
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path("free-fire-clocktower-3d-model-by-rs-ratul.zip")
          if not archive.is_file():
              raise SystemExit("Clocktower source archive missing from repository")
          root=Path("build/clocktower/source")
          def unpack(path,destination,depth=0):
              if depth>3:
                  return
              with zipfile.ZipFile(path) as z:
                  z.extractall(destination)
              for nested in list(destination.rglob("*.zip")):
                  target=nested.parent/(nested.stem+"_extracted")
                  if not target.exists():
                      unpack(nested,target,depth+1)
          unpack(archive,root)
          matches=list(root.rglob("FF CLOCKTOWER BY RATUL.blend"))
          if len(matches)!=1:
              raise SystemExit(f"Expected one Clocktower blend file, found {len(matches)}")
          print("CLOCKTOWER_SOURCE",matches[0])
          print("CLOCKTOWER_TEXTURE_FILES",sum(1 for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png",".jpg",".jpeg"}))
          Path("build/clocktower/source-path.txt").write_text(str(matches[0]),encoding="utf-8")
          PY
          echo "CLOCKTOWER_ROOT=$GITHUB_WORKSPACE/build/clocktower/source" >> "$GITHUB_ENV"
          echo "CLOCKTOWER_BLEND=$GITHUB_WORKSPACE/$(cat build/clocktower/source-path.txt)" >> "$GITHUB_ENV"
          echo "CLOCKTOWER_GLB=$GITHUB_WORKSPACE/game/assets/maps/clocktower.glb" >> "$GITHUB_ENV"

      - name: Convert Clocktower to centered Y-up GLB with embedded textures
        run: |
          /opt/blender/blender -b -t 2 --python-exit-code 1 --python tools/convert_clocktower.py 2>&1 | tee build/clocktower/convert.log
          grep "CLOCKTOWER_GLB_OK" build/clocktower/convert.log
          test -s game/assets/maps/clocktower.glb

      - name: Install Godot 4.7.2 headless
        run: |
          mkdir -p tools/godot
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d tools/godot
          chmod +x tools/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$GITHUB_WORKSPACE/tools/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import Clocktower in an isolated Godot project and validate interiors
        run: |
          mkdir -p build/clocktower/godot/assets/maps build/clocktower/godot/scripts
          cp game/assets/maps/clocktower.glb build/clocktower/godot/assets/maps/
          cp game/assets/maps/clocktower.glb.json build/clocktower/godot/assets/maps/
          cat > build/clocktower/godot/project.godot <<'GODOT'
          config_version=5

          [application]
          config/name="Clocktower Map Audit"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT
          "$GODOT_BIN" --headless --editor --path build/clocktower/godot --quit 2>&1 | tee build/clocktower/godot-import.log
          cat > build/clocktower/godot/scripts/clocktower_map_audit.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_audit")

          func _audit() -> void:
              var packed := load("res://assets/maps/clocktower.glb") as PackedScene
              if packed == null:
                  push_error("CLOCKTOWER_AUDIT_FAILED: GLB did not import")
                  quit(1)
                  return
              var test_root := Node3D.new()
              root.add_child(test_root)
              var map := packed.instantiate() as Node3D
              if map == null:
                  push_error("CLOCKTOWER_AUDIT_FAILED: map root is not Node3D")
                  quit(1)
                  return
              test_root.add_child(map)
              await process_frame

              var meshes := map.find_children("*", "MeshInstance3D", true, false)
              if meshes.size() < 30:
                  push_error("CLOCKTOWER_AUDIT_FAILED: expected at least 30 meshes, found %d" % meshes.size())
                  quit(1)
                  return

              var min_point := Vector3(INF, INF, INF)
              var max_point := Vector3(-INF, -INF, -INF)
              var textured_surfaces := 0
              var collider_count := 0
              for node in meshes:
                  var mesh_instance := node as MeshInstance3D
                  if mesh_instance.mesh == null:
                      continue
                  var aabb := mesh_instance.get_aabb()
                  for corner_index in range(8):
                      var point := mesh_instance.global_transform * aabb.get_endpoint(corner_index)
                      min_point = Vector3(minf(min_point.x, point.x), minf(min_point.y, point.y), minf(min_point.z, point.z))
                      max_point = Vector3(maxf(max_point.x, point.x), maxf(max_point.y, point.y), maxf(max_point.z, point.z))
                  for surface in range(mesh_instance.mesh.get_surface_count()):
                      var material := mesh_instance.get_active_material(surface)
                      if material is StandardMaterial3D and (material as StandardMaterial3D).albedo_texture != null:
                          textured_surfaces += 1
                  var before := mesh_instance.get_child_count()
                  mesh_instance.create_trimesh_collision()
                  if mesh_instance.get_child_count() > before:
                      collider_count += 1

              var dimensions: Vector3 = max_point - min_point
              print("CLOCKTOWER_GEOMETRY meshes=", meshes.size(), " dimensions=", dimensions,
                  " textured_surfaces=", textured_surfaces, " colliders=", collider_count)
              if dimensions.x < 70.0 or dimensions.x > 100.0 or dimensions.y < 20.0 or dimensions.y > 35.0 or dimensions.z < 95.0 or dimensions.z > 130.0:
                  push_error("CLOCKTOWER_AUDIT_FAILED: unexpected map orientation or scale")
                  quit(2)
                  return
              if textured_surfaces < 5:
                  push_error("CLOCKTOWER_AUDIT_FAILED: map textures did not import")
                  quit(3)
                  return
              if collider_count < 30:
                  push_error("CLOCKTOWER_AUDIT_FAILED: not enough mesh collisions")
                  quit(4)
                  return

              await physics_frame
              await physics_frame
              var space := test_root.get_world_3d().direct_space_state
              var report_path := "res://assets/maps/clocktower.glb.json"
              var report: Variant = JSON.parse_string(FileAccess.get_file_as_string(report_path))
              if not report is Dictionary:
                  push_error("CLOCKTOWER_AUDIT_FAILED: conversion report missing")
                  quit(5)
                  return
              var objects: Array = report.get("objects", [])
              var building_prefixes := [
                  "Zone_A_House_Medium_B_LOD0_0",
                  "Zone_A_House_Medium_A_LOD0_0",
                  "Zone_A_House_Huge_A_LOD0_0",
                  "Zone_A_House_Big_B_LOD0_1",
                  "mansion_LOD0_0",
                  "Tower_01_LOD0_0"
              ]
              var buildings_with_floor: int = 0
              for prefix in building_prefixes:
                  var selected: Dictionary = {}
                  for object_data in objects:
                      if String(object_data.get("name", "")).begins_with(prefix):
                          selected = object_data
                          break
                  if selected.is_empty():
                      print("CLOCKTOWER_INTERIOR_MISSING_OBJECT ", prefix)
                      continue
                  var center_data: Array = selected.get("center", [0.0, 0.0, 0.0])
                  var minimum_data: Array = selected.get("bounds_min", [0.0, 0.0, 0.0])
                  var center := Vector3(float(center_data[0]), float(center_data[2]), float(center_data[1]))
                  var floor_y: float = float(minimum_data[2])
                  var found_floor := false
                  for offset_x in [-2.0, 0.0, 2.0]:
                      for offset_z in [-2.0, 0.0, 2.0]:
                          var sample_x: float = center.x + float(offset_x)
                          var sample_z: float = center.z + float(offset_z)
                          var query := PhysicsRayQueryParameters3D.create(
                              Vector3(sample_x, floor_y + 1.4, sample_z),
                              Vector3(sample_x, floor_y - 0.35, sample_z)
                          )
                          var hit := space.intersect_ray(query)
                          if not hit.is_empty() and absf(float(hit.position.y) - floor_y) <= 0.55:
                              found_floor = true
                              print("CLOCKTOWER_INTERIOR_HIT ", prefix, " y=", hit.position.y, " floor_ref=", floor_y)
                              break
                      if found_floor:
                          break
                  if found_floor:
                      buildings_with_floor += 1
                  else:
                      print("CLOCKTOWER_INTERIOR_MISS ", prefix, " center=", center, " floor_ref=", floor_y)
              print("CLOCKTOWER_INTERIOR_FLOORS accessible_buildings=", buildings_with_floor, "/", building_prefixes.size())
              if buildings_with_floor < 3:
                  push_error("CLOCKTOWER_AUDIT_FAILED: fewer than three accessible building floors")
                  quit(5)
                  return
              print("CLOCKTOWER_MAP_AUDIT_OK: meshes=", meshes.size(), " textures=", textured_surfaces,
                  " colliders=", collider_count, " interior_floors=", buildings_with_floor)
              quit(0)
          GDSCRIPT
          "$GODOT_BIN" --headless --path build/clocktower/godot --script res://scripts/clocktower_map_audit.gd 2>&1 | tee build/clocktower/map-audit.log
          grep "CLOCKTOWER_MAP_AUDIT_OK" build/clocktower/map-audit.log

      - name: Upload Clocktower map validation package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clocktower-map-godot-validation
          path: |
            game/assets/maps/clocktower.glb
            game/assets/maps/clocktower.glb.json
            build/clocktower/
          if-no-files-found: warn
          retention-days: 14
