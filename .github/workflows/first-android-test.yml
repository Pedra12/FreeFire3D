name: First Android map test build

on:
  push:
    paths:
      - ".github/workflows/first-android-test.yml"
      - "game/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages and Blender
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "build-tools;36.1.0" "platforms;android-36"
          sudo apt-get update
          sudo apt-get install -y blender libegl1
          mkdir -p build

      - name: Download Godot 4.7.2 and Android debug template
        run: |
          mkdir -p tools/godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_debug.perfetto.apk" -o /tmp/android_debug.apk
          unzip -q /tmp/godot.zip -d tools/godot
          GODOT_BIN="$(find tools/godot -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          cp /tmp/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          echo "4.7.2.stable" > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          "$GODOT_BIN" --version

      - name: Extract original map and Clocktower assets
        run: |
          mkdir -p /tmp/freefire-assets game/assets/maps build
          python3 - <<'PY'
          import zipfile, io, pathlib, re
          root=pathlib.Path('/tmp/freefire-assets')
          def walk(label, raw, depth=0):
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      for item in z.infolist():
                          if item.is_dir(): continue
                          ext=pathlib.Path(item.filename).suffix.lower()
                          data=z.read(item)
                          if ext=='.zip' and depth<5:
                              walk(label+'_'+pathlib.Path(item.filename).stem, data, depth+1)
                          elif ext in ('.blend','.png','.jpg','.jpeg','.webp','.tga'):
                              name=re.sub(r'[^A-Za-z0-9_.-]+','_',label+'_'+item.filename)
                              target=root/name
                              target.parent.mkdir(parents=True,exist_ok=True)
                              target.write_bytes(data)
              except Exception as exc:
                  raise RuntimeError(f'Archive extraction failed for {label}: {exc}')
          for archive in sorted(pathlib.Path('.').glob('*.zip')):
              walk(archive.stem, archive.read_bytes())
          full=list(root.rglob('*hh.blend'))
          clock=list(root.rglob('*FF_CLOCKTOWER_BY_RATUL.blend'))
          if len(full)!=1: raise SystemExit(f'Expected one full map Blender file, found {len(full)}')
          if len(clock)!=1: raise SystemExit(f'Expected one Clocktower Blender file, found {len(clock)}')
          print('FULL_MAP',full[0])
          print('CLOCKTOWER',clock[0])
          PY

      - name: Convert map to Godot GLB without changing source archives
        run: |
          cat > /tmp/export_map.py <<'PY'
          import bpy, pathlib, json, math, traceback
          from mathutils import Vector, Matrix
          from pathlib import Path
          root=Path('/tmp/freefire-assets')
          full=next(root.rglob('*hh.blend'))
          chunk=next(root.rglob('*FF_CLOCKTOWER_BY_RATUL.blend'))
          bpy.ops.wm.open_mainfile(filepath=str(full))
          full_meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']
          full_materials={m for o in full_meshes for m in o.data.materials if m}
          # The full-map source deliberately remains neutral white: its two original
          # NeoParadise image files are absent from the supplied archives.
          for mat in full_materials:
              if not mat.use_nodes or not mat.node_tree: continue
              bsdf=next((n for n in mat.node_tree.nodes if n.type=='BSDF_PRINCIPLED'),None)
              if bsdf:
                  for link in list(mat.node_tree.links):
                      if link.to_node==bsdf and link.to_socket.name=='Base Color':
                          mat.node_tree.links.remove(link)
                  bsdf.inputs['Base Color'].default_value=(0.82,0.82,0.82,1.0)
                  bsdf.inputs['Roughness'].default_value=0.92
          # Append the complete Clocktower collection hierarchy.
          with bpy.data.libraries.load(str(chunk),link=False) as (src,dst):
              dst.collections=src.collections
          collections=[]
          for col in dst.collections:
              if col is not None:
                  bpy.context.scene.collection.children.link(col)
                  collections.append(col)
          chunk_meshes=list({o for col in collections for o in col.all_objects if o.type=='MESH'})
          # Convert source Y-up coordinates to Blender Z-up and align the base to the full map.
          rotate=Matrix.Rotation(math.radians(90),4,'X')
          translate=Matrix.Translation(Vector((0,0,-20.0)))
          for obj in chunk_meshes:
              obj.matrix_world=translate @ rotate @ obj.matrix_world
          # Reconnect Clocktower texture images by their original filename.
          loaded=0; missing=[]
          for mat in {m for o in chunk_meshes for m in o.data.materials if m}:
              if not mat.use_nodes or not mat.node_tree: continue
              bsdf=next((n for n in mat.node_tree.nodes if n.type=='BSDF_PRINCIPLED'),None)
              for node in mat.node_tree.nodes:
                  if node.type!='TEX_IMAGE' or not node.image: continue
                  basename=Path(node.image.filepath).name.lower()
                  matches=[p for p in root.rglob('*') if p.is_file() and p.name.lower().endswith('_'+basename)]
                  if matches:
                      try:
                          node.image=bpy.data.images.load(str(matches[0]),check_existing=True)
                          loaded+=1
                      except Exception:
                          missing.append(basename)
                  else:
                      missing.append(basename)
                      if bsdf:
                          for link in list(mat.node_tree.links):
                              if link.from_node==node and link.to_node==bsdf:
                                  mat.node_tree.links.remove(link)
          # Keep only actual scene geometry in the export.
          out=Path('game/assets/maps/full_map_test.glb')
          out.parent.mkdir(parents=True,exist_ok=True)
          try:
              bpy.ops.preferences.addon_enable(module='io_scene_gltf2')
          except Exception:
              pass
          bpy.ops.export_scene.gltf(filepath=str(out),export_format='GLB',export_apply=True,
                                    export_materials='EXPORT',export_cameras=False,export_lights=False,
                                    export_yup=True)
          all_meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']
          points=[o.matrix_world @ Vector(c) for o in all_meshes for c in o.bound_box]
          report={'source_full_map':full.name,'source_clocktower':chunk.name,
                  'full_map_mesh_objects':len(full_meshes),'clocktower_mesh_objects':len(chunk_meshes),
                  'export_mesh_objects':len(all_meshes),'reconnected_texture_nodes':loaded,
                  'unresolved_texture_names':sorted(set(missing)),
                  'clocktower_axis_conversion':'Y-up to Z-up (90 degrees around X)',
                  'clocktower_world_z_offset':-20.0,'glb_bytes':out.stat().st_size}
          if points:
              report['world_bounds']={a:[min(getattr(p,a) for p in points),max(getattr(p,a) for p in points)] for a in 'xyz'}
          Path('build/map-export-report.json').write_text(json.dumps(report,indent=2),encoding='utf8')
          print(json.dumps(report,indent=2))
          PY
          blender -b --python /tmp/export_map.py 2>&1 | tee build/blender-export.log
          test -s game/assets/maps/full_map_test.glb
          ls -lh game/assets/maps/full_map_test.glb

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|__DEBUG_KEYSTORE__|$HOME/.android/debug.keystore|g" game/export_presets.cfg

      - name: Import and validate Godot project
        run: |
          "$GODOT_BIN" --headless --editor --path game --quit 2>&1 | tee build/godot-import.log
          "$GODOT_BIN" --headless --path game --quit-after 3 2>&1 | tee build/godot-smoke-test.log

      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/FreeFire3D-Teste.apk" 2>&1 | tee build/android-export.log
          test -s build/FreeFire3D-Teste.apk
          unzip -t build/FreeFire3D-Teste.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/FreeFire3D-Teste.apk | tee build/apk-badging.txt
          unzip -l build/FreeFire3D-Teste.apk | grep -E 'lib/arm64-v8a/.*\.so' | tee build/apk-native-libraries.txt
          sha256sum build/FreeFire3D-Teste.apk | tee build/apk-sha256.txt

      - name: Upload first test APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-primeiro-APK-de-teste
          path: |
            build/
            game/assets/maps/full_map_test.glb
          if-no-files-found: warn
          retention-days: 14
