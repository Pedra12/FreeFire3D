name: FreeFire3D Bermuda Survival Android

on:
  push:
    paths:
      - ".github/workflows/first-android-test.yml"
      - "game/**"
  workflow_dispatch:

concurrency:
  group: freefire3d-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "build-tools;36.1.0" "platforms;android-36"
          mkdir -p build

      - name: Download Godot 4.7.2 and Android debug template
        run: |
          mkdir -p tools/godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_debug.perfetto.apk" -o /tmp/android_debug.apk
          unzip -q /tmp/godot.zip -d tools/godot
          GODOT_BIN="$(find tools/godot -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          cp /tmp/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          echo "4.7.2.stable" > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          "$GODOT_BIN" --version

      - name: Convert complete River Side USDZ map with official Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xz-utils unzip curl
          mkdir -p /opt/blender game/assets/maps build/river_side/source build/river_side/converted
          if curl -L --fail --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz; then
            tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          else
            echo "Official Blender download unavailable; using Ubuntu Blender package"
            ln -sf "$(command -v blender)" /opt/blender/blender
          fi
          /opt/blender/blender --version
          python3 - <<'PY'
          import zipfile, pathlib, json
          archive=pathlib.Path("River_Side_3D_Model_Free_Fire.usdz")
          root=pathlib.Path("build/river_side/source")
          with zipfile.ZipFile(archive) as z:
              entries=z.namelist()
              usdc=[n for n in entries if n.lower().endswith(".usdc")]
              textures=[n for n in entries if n.lower().endswith((".png",".jpg",".jpeg"))]
              if len(usdc)!=1: raise SystemExit(f"Expected one USD scene, found {usdc}")
              for name in entries:
                  if name.endswith("/"): continue
                  target=root/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(name))
          pathlib.Path("build/river_side/source-report.json").write_text(json.dumps(
              {"usd_scene":usdc[0],"texture_count":len(textures),"archive_entries":len(entries)},indent=2))
          print("RIVER_SIDE_SOURCE textures=",len(textures),"entries=",len(entries))
          PY
          cat > build/river_side/convert_usd.py <<'PY'
          import bpy, os, json
          source=os.environ["USD_FILE"]
          output=os.environ["GLB_FILE"]
          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)
          bpy.ops.wm.usd_import(filepath=source, import_textures_mode="IMPORT_PACK")
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if len(meshes)<400: raise RuntimeError(f"River Side mesh count too low: {len(meshes)}")
          bpy.ops.object.select_all(action="DESELECT")
          for obj in meshes: obj.select_set(True)
          bpy.context.view_layer.objects.active=meshes[0]
          bpy.ops.export_scene.gltf(filepath=output,export_format="GLB",use_selection=True,
              export_apply=True,export_texcoords=True,export_normals=True,
              export_materials="EXPORT",export_cameras=False,export_lights=False)
          report={"objects":len(meshes),"vertices":sum(len(o.data.vertices) for o in meshes),
              "polygons":sum(len(o.data.polygons) for o in meshes),
              "materials":len({m.name for o in meshes for m in o.data.materials if m}),
              "output_bytes":os.path.getsize(output)}
          with open(output+".json","w") as f: json.dump(report,f,indent=2)
          print("RIVER_SIDE_GLB_CONVERTED",json.dumps(report))
          PY
          export USD_FILE="$(find build/river_side/source -maxdepth 2 -name '*.usdc' | head -n 1)"
          export GLB_FILE="$PWD/build/river_side/converted/river_side.glb"
          test -n "$USD_FILE"
          /opt/blender/blender -b -t 2 --python build/river_side/convert_usd.py 2>&1 | tee build/river_side/blender-conversion.log
          grep RIVER_SIDE_GLB_CONVERTED build/river_side/blender-conversion.log
          test -s "$GLB_FILE"
          cp "$GLB_FILE" game/assets/maps/river_side.glb
          test "$(stat -c%s game/assets/maps/river_side.glb)" -gt 10000000
          ls -lh game/assets/maps/river_side.glb

      - name: Build rigged player with 86 animation clips
        run: |
          git clone --depth 1 https://github.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender.git /tmp/quaternius
          mkdir -p game/assets/characters build
          BASE="/tmp/quaternius/Universal Base Characters[Standard]/Universal Base Characters[Standard]/Base Characters/Godot - UE"
          UAL1="/tmp/quaternius/Universal Animation Library[Standard]/Universal Animation Library[Standard]/Unreal-Godot/UAL1_Standard.glb"
          UAL2="/tmp/quaternius/Universal Animation Library 2[Standard]/Universal Animation Library 2[Standard]/Unreal-Godot/UAL2_Standard.glb"
          cp "$BASE"/* game/assets/characters/
          cp "$UAL1" "$UAL2" game/assets/characters/
          cp /tmp/quaternius/merge/merge.mjs game/assets/characters/
          cp /tmp/quaternius/merge/package.json game/assets/characters/
          cd game/assets/characters
          node -e "let p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm install --no-audit --no-fund
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('Superhero_Female_FullBody.gltf','utf8'));
          for (const im of p.images||[]) {
            if (!im.uri) continue;
            const target=im.uri;
            if (!fs.existsSync(target)) {
              const alt=target.replace(/_png(\.[^.]+)$/,'$1');
              if (fs.existsSync(alt)) fs.copyFileSync(alt,target);
            }
          }
          JS
          node merge.mjs Superhero_Female_FullBody.gltf female_player_rigged.glb UAL1_Standard.glb UAL2_Standard.glb | tee "$GITHUB_WORKSPACE/build/merge-report.log"
          test -s female_player_rigged.glb
          cd "$GITHUB_WORKSPACE"
          rm -f game/assets/characters/UAL1_Standard.glb game/assets/characters/UAL2_Standard.glb
          rm -f game/assets/characters/merge.mjs game/assets/characters/package.json game/assets/characters/package-lock.json
          rm -f game/assets/characters/Superhero_Male_FullBody.gltf
          rm -f game/assets/characters/Superhero_Male_FullBody.bin
          sha256sum game/assets/characters/female_player_rigged.glb | tee build/female-player-sha256.txt

      - name: Extract AWM weapon model
        run: |
          mkdir -p game/assets/weapons build
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          archive=pathlib.Path("awm-free-fire.zip")
          with zipfile.ZipFile(archive) as z:
              matches=[n for n in z.namelist() if n.lower().endswith("awm_free_fire.glb")]
              if len(matches)!=1:
                  raise SystemExit(f"Expected one AWM GLB, found: {matches}")
              data=z.read(matches[0])
          target=pathlib.Path("game/assets/weapons/awm_free_fire.glb")
          target.write_bytes(data)
          print("AWM_EXTRACTED",matches[0],"bytes",len(data),"sha256",hashlib.sha256(data).hexdigest())
          PY
          test -s game/assets/weapons/awm_free_fire.glb

      - name: Download CC0 premium weapon model sources
        run: |
          mkdir -p build/weapons-source game/assets/weapons
          curl -L --fail --retry 3 https://cdn.3dassets.dev/assets/33318/v1/model.glb -o build/weapons-source/assault_rifle.glb
          curl -L --fail --retry 3 https://cdn.3dassets.dev/assets/33303/v1/model.glb -o build/weapons-source/smg.glb
          curl -L --fail --retry 3 https://cdn.3dassets.dev/assets/33311/v1/model.glb -o build/weapons-source/shotgun.glb
          curl -L --fail --retry 3 https://cdn.3dassets.dev/assets/33296/v1/model.glb -o build/weapons-source/pistol.glb
          python3 - <<'PY'
          import os
          for name in ["assault_rifle","smg","shotgun","pistol"]:
              path=f"build/weapons-source/{name}.glb"
              size=os.path.getsize(path)
              if size < 100000:
                  raise SystemExit(f"Weapon source model too small: {name} {size}")
              print("WEAPON_SOURCE_OK",name,size)
          PY

      - name: Convert weapon models to Godot-compatible GLB
        run: |
          /opt/blender/blender -b -t 2 --python-exit-code 1 --python tools/convert_weapon_glbs.py 2>&1 | tee build/weapon-conversion.log
          for name in assault_rifle smg shotgun pistol; do test -s "game/assets/weapons/$name.glb"; done
          grep "WEAPON_CONVERSION_OK" build/weapon-conversion.log

      - name: Download CC0 footsteps audio
        run: |
          mkdir -p game/assets/audio build/audio
          curl -L --fail --retry 3 -A "FreeFire3D-asset-pipeline/1.0" "https://opengameart.org/sites/default/files/RPGsounds_Kenney.zip" -o /tmp/kenney-rpg-audio.zip
          python3 - <<'PY'
          import zipfile, pathlib, json
          archive=pathlib.Path('/tmp/kenney-rpg-audio.zip')
          with zipfile.ZipFile(archive) as z:
              matches=[n for n in z.namelist() if n.lower().endswith('/footstep00.ogg') or n.lower()=='footstep00.ogg']
              if not matches:
                  raise SystemExit('Kenney CC0 audio pack is missing footstep00.ogg')
              target=pathlib.Path('game/assets/audio/footstep00.ogg')
              target.write_bytes(z.read(matches[0]))
              for index in range(1,4):
                  options=[n for n in z.namelist() if n.lower().endswith('/footstep%02d.ogg'%index) or n.lower()=='footstep%02d.ogg'%index]
                  if options:
                      pathlib.Path('game/assets/audio/footstep%02d.ogg'%index).write_bytes(z.read(options[0]))
              pathlib.Path('game/assets/audio/ASSET_CREDITS.txt').write_text('Footstep audio: Kenney RPG Audio, CC0 1.0. Source: https://kenney.nl/assets/rpg-audio and https://opengameart.org/content/50-rpg-sound-effects\\n',encoding='utf-8')
              print('FOOTSTEP_AUDIO_OK',matches[0],target.stat().st_size)
          PY
          test -s game/assets/audio/footstep00.ogg

      - name: Download 2K CC0 PBR materials from Poly Haven
        run: |
          python3 tools/download_polyhaven_pbr.py 2>&1 | tee build/polyhaven-pbr-download.log
          grep "POLYHAVEN_PBR_OK" build/polyhaven-pbr-download.log
          test -s game/assets/textures/pbr/manifest.json

      - name: Rig original Olivia model to the existing 86-clip humanoid skeleton
        run: |
          mkdir -p game/assets/characters build/olivia
          python3 - <<'PY'
          import zipfile, pathlib
          archive=pathlib.Path("olivia-free-fire.zip")
          with zipfile.ZipFile(archive) as z:
              entry="source/olivia-free_fire.glb"
              if entry not in z.namelist(): raise SystemExit("Olivia source GLB missing")
              target=pathlib.Path("game/assets/characters/olivia_source.glb")
              target.write_bytes(z.read(entry))
              print("OLIVIA_SOURCE_EXTRACTED",entry,target.stat().st_size)
          PY
          /opt/blender/blender -b -t 2 --python-exit-code 1 --python tools/rig_olivia.py -- game/assets/characters/female_player_rigged.glb game/assets/characters/olivia_source.glb game/assets/characters/olivia_rigged.glb 2>&1 | tee build/olivia-rigging.log
          grep "OLIVIA_RIG_OK" build/olivia-rigging.log
          test -s game/assets/characters/olivia_rigged.glb

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|__DEBUG_KEYSTORE__|$HOME/.android/debug.keystore|g" game/export_presets.cfg

      - name: Import and validate Godot project
        run: |
          "$GODOT_BIN" --headless --editor --path game --quit 2>&1 | tee build/godot-import.log
          "$GODOT_BIN" --headless --path game --script res://scripts/olivia_rig_audit.gd 2>&1 | tee build/olivia-rig-godot-audit.log
          grep "OLIVIA_RIG_GODOT_OK" build/olivia-rig-godot-audit.log
          "$GODOT_BIN" --headless --path game --script res://scripts/scale_audit.gd 2>&1 | tee build/scale-audit.log
          "$GODOT_BIN" --headless --path game --script res://scripts/weapon_asset_audit.gd 2>&1 | tee build/weapon-asset-audit.log
          grep "WEAPON_AUDIT_OK" build/weapon-asset-audit.log
          grep "WEAPON_MOUNT_OK" build/weapon-asset-audit.log
          "$GODOT_BIN" --headless --path game --script res://scripts/combat_smoke_test.gd 2>&1 | tee build/combat-smoke-test.log
          grep "COMBAT_TEST_OK" build/combat-smoke-test.log
          "$GODOT_BIN" --headless --path game --script res://scripts/main_gameplay_smoke_test.gd 2>&1 | tee build/main-gameplay-smoke-test.log
          grep "MAIN_GAMEPLAY_TEST_OK" build/main-gameplay-smoke-test.log
          grep "WEAPON_MOUNT_OK" build/main-gameplay-smoke-test.log
          "$GODOT_BIN" --headless --path game --quit-after 8 2>&1 | tee build/godot-smoke-test.log
          grep "WORLD_COLLISIONS generated=" build/godot-smoke-test.log
          if grep -E "ERROR:|SCRIPT ERROR:" build/godot-import.log build/godot-smoke-test.log build/combat-smoke-test.log build/main-gameplay-smoke-test.log build/weapon-asset-audit.log; then exit 1; fi

      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/FreeFire3D-RiverSide-Survival.apk" 2>&1 | tee build/android-export.log
          test -s build/FreeFire3D-RiverSide-Survival.apk
          unzip -t build/FreeFire3D-RiverSide-Survival.apk
          AAPT_BIN="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT_BIN"
          "$AAPT_BIN" dump badging build/FreeFire3D-RiverSide-Survival.apk | tee build/apk-badging.txt
          unzip -l build/FreeFire3D-RiverSide-Survival.apk | grep -E 'lib/arm64-v8a/.*\.so' | tee build/apk-native-libraries.txt
          sha256sum build/FreeFire3D-RiverSide-Survival.apk | tee build/apk-sha256.txt

      - name: Upload Android player prototype and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire3D-RiverSide-Survival-APK
          path: build/
          if-no-files-found: warn
          retention-days: 14
