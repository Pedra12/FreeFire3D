name: Prepare canonical Olivia skinned GLB

on:
  push:
    branches:
      - unity-project
    paths:
      - "Tools/test_rig_olivia.py"
      - ".github/workflows/test-olivia-rig.yml"
      - "SourceArchives/olivia-free-fire.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rig-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated Unity project
        uses: actions/checkout@v4
      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil
      - name: Generate rigged GLB and validate its round-trip
        run: blender --background --python Tools/test_rig_olivia.py -- "$GITHUB_WORKSPACE"
      - name: Commit the single canonical Olivia model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Game/Characters/Olivia/Olivia.glb Assets/Game/Characters/Olivia/OliviaRigReport.json
          if ! git diff --cached --quiet; then
            git commit -m "Import single rigged Olivia Humanoid GLB"
            git pull --rebase origin unity-project
            git push origin HEAD:unity-project
          fi
