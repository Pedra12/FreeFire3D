name: Map and Clocktower alignment test

on:
  push:
    paths:
      - ".github/workflows/map-alignment-test.yml"
      - "docs/map-alignment-trigger.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1
      - name: Extract map scenes and Clocktower textures
        run: |
          mkdir -p /tmp/assets audit
          python3 - <<'PY'
          import zipfile,io,pathlib,re
          root=pathlib.Path('/tmp/assets')
          def walk(label,raw,depth=0):
            try:
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                for i in z.infolist():
                  if i.is_dir(): continue
                  e=pathlib.Path(i.filename).suffix.lower(); b=z.read(i)
                  if e=='.zip' and depth<5: walk(label+'_'+pathlib.Path(i.filename).name,b,depth+1)
                  elif e in ('.blend','.png','.jpg','.jpeg'):
                    p=root/(re.sub(r'[^A-Za-z0-9_.-]+','_',label+'_'+i.filename)); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(b)
            except Exception as e: print('EXTRACT_ERROR',label,str(e))
          for p in pathlib.Path('.').iterdir():
            if p.suffix.lower()=='.zip': walk(p.stem,p.read_bytes())
          PY
      - name: Build combined alignment preview
        shell: bash
        run: |
          cat > /tmp/align.py <<'PY'
          import bpy, pathlib, json, os, traceback
          from mathutils import Vector
          root=pathlib.Path('/tmp/assets')
          full=next(root.glob('*hh.blend'))
          chunk=next(root.glob('*CLOCKTOWER*.blend'))
          bpy.ops.wm.open_mainfile(filepath=str(full))
          full_objs=[o for o in bpy.context.scene.objects if o.type=='MESH']
          full_pts=[o.matrix_world @ Vector(c) for o in full_objs for c in o.bound_box]
          report={'full_map':{'file':str(full),'objects':len(full_objs)}}
          report['full_map']['bounds']={a:[min(getattr(p,a) for p in full_pts),max(getattr(p,a) for p in full_pts)] for a in 'xyz'}
          with bpy.data.libraries.load(str(chunk),link=False) as (src,dst):
            dst.objects=src.objects
          chunk_objs=[]
          for o in dst.objects:
            if o is not None:
              bpy.context.scene.collection.objects.link(o)
              if o.type=='MESH':
                mw=o.matrix_world.copy(); mw.translation.z-=20.0; o.matrix_world=mw
                chunk_objs.append(o)
          # Restore Clocktower image references using exact basename or archive-prefixed suffix.
          for im in bpy.data.images:
            if im.source=='FILE':
              name=pathlib.Path(im.filepath).name.lower()
              candidates=[p for p in root.rglob('*') if p.is_file() and p.name.lower().endswith('_'+name)]
              if candidates:
                im.filepath=str(candidates[0])
                try: im.reload()
                except: pass
          pts=[o.matrix_world @ Vector(c) for o in chunk_objs for c in o.bound_box]
          report['clocktower']={'file':str(chunk),'objects':len(chunk_objs),'z_offset':-20.0}
          report['clocktower']['bounds_after_offset']={a:[min(getattr(p,a) for p in pts),max(getattr(p,a) for p in pts)] for a in 'xyz'}
          # Add unique viewport material colors to distinguish source groups.
          for o in full_objs:
            o.color=(0.8,0.2,0.8,1)
          for o in chunk_objs:
            o.color=(0.2,0.7,0.3,1)
          scene=bpy.context.scene
          scene.render.engine='BLENDER_WORKBENCH'
          scene.display.shading.light='STUDIO'; scene.display.shading.color_type='OBJECT'
          scene.display.shading.show_shadows=True
          scene.render.resolution_x=1280; scene.render.resolution_y=960; scene.render.resolution_percentage=80
          scene.render.image_settings.file_format='PNG'
          allpts=full_pts+pts
          lo=Vector([min(getattr(p,a) for p in allpts) for a in 'xyz'])
          hi=Vector([max(getattr(p,a) for p in allpts) for a in 'xyz'])
          center=(lo+hi)*.5; span=max((hi-lo).length,1)
          cd=bpy.data.cameras.new('TopCamera'); cam=bpy.data.objects.new('TopCamera',cd); scene.collection.objects.link(cam)
          cam.location=Vector((center.x,center.y,hi.z+span*1.3)); cam.rotation_euler=(Vector((center.x,center.y,center.z))-cam.location).to_track_quat('-Z','Y').to_euler(); cd.type='ORTHO'; cd.ortho_scale=max(hi.x-lo.x,hi.y-lo.y)*1.18; scene.camera=cam
          scene.render.filepath=os.path.abspath('audit/combined-top.png'); bpy.ops.render.render(write_still=True)
          # Side view to check vertical offset.
          cam.location=Vector((center.x-span*1.5,center.y,center.z+span*.25)); cam.rotation_euler=(center-cam.location).to_track_quat('-Z','Y').to_euler(); cd.type='ORTHO'; cd.ortho_scale=span*1.2
          scene.render.filepath=os.path.abspath('audit/combined-side.png'); bpy.ops.render.render(write_still=True)
          pathlib.Path('audit/alignment.json').write_text(json.dumps(report,indent=2),encoding='utf8')
          PY
          blender -b --python /tmp/align.py > audit/alignment.log 2>&1
      - name: Upload alignment preview
        uses: actions/upload-artifact@v4
        with:
          name: freefire3d-map-alignment-test
          path: audit/
          if-no-files-found: error
          retention-days: 7
