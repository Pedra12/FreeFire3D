name: Asset audit
# 4v4 prototype: validate weapon, character, building, map and texture archives before integration

on:
  push:
    paths:
      - ".github/workflows/asset-audit.yml"
      - "docs/asset-audit-trigger.md"
      - "*.zip"
      - "*.usdz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image inspection support
        run: python3 -m pip install --user pillow

      - name: Recursively inspect archives and assets
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, zipfile, hashlib, struct
          from pathlib import Path
          from PIL import Image

          report = {"notice": "Read-only recursive audit. Original repository assets are not modified.", "archives": []}
          def inspect_zip(label, raw, depth=0):
              result = {"archive": label, "depth": depth, "bytes": len(raw), "entries": [], "entry_count": 0, "formats": {}}
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      infos = [i for i in z.infolist() if not i.is_dir()]
                      result["entry_count"] = len(infos)
                      for info in infos:
                          name = info.filename
                          ext = Path(name).suffix.lower() or "[no extension]"
                          result["formats"][ext] = result["formats"].get(ext, 0) + 1
                          entry = {"path": name, "bytes": info.file_size}
                          if depth < 4 and ext == ".zip":
                              try:
                                  nested = z.read(info)
                                  entry["nested_archive"] = inspect_zip(label + " :: " + name, nested, depth + 1)
                              except Exception as e:
                                  entry["nested_error"] = str(e)[:200]
                          elif ext in {".obj", ".gltf", ".glb", ".fbx", ".dae", ".blend", ".mtl", ".png", ".jpg", ".jpeg", ".webp", ".tga", ".ktx", ".dds", ".usdc"}:
                              try:
                                  data = z.read(info)
                                  if ext == ".obj":
                                      lines = data[:16000000].decode("utf-8", "replace").splitlines()
                                      entry["obj_stats"] = {k: sum(1 for line in lines if line.startswith(prefix)) for k,prefix in
                                                            [("vertices","v "),("uvs","vt "),("normals","vn "),("faces","f ")]}
                                  elif ext == ".gltf":
                                      d = json.loads(data.decode("utf-8-sig"))
                                      entry["gltf"] = {"asset": d.get("asset", {}), "scenes": len(d.get("scenes", [])),
                                                       "nodes": len(d.get("nodes", [])), "meshes": len(d.get("meshes", [])),
                                                       "materials": len(d.get("materials", [])), "textures": len(d.get("textures", [])),
                                                       "images": d.get("images", []), "buffers": d.get("buffers", [])}
                                  elif ext == ".glb" and len(data) >= 12:
                                      entry["glb"] = {"version": struct.unpack("<I", data[4:8])[0],
                                                      "declared_length": struct.unpack("<I", data[8:12])[0]}
                                  elif ext == ".fbx":
                                      entry["fbx_header"] = data[:32].decode("latin1", "replace")
                                  elif ext == ".blend":
                                      entry["blend_header"] = data[:12].decode("latin1", "replace")
                                  elif ext == ".dae":
                                      entry["dae_has_geometry"] = b"<geometry" in data[:2000000]
                                  elif ext == ".mtl":
                                      entry["mtl_materials"] = [s.strip() for s in data.decode("utf-8", "replace").splitlines() if s.startswith("newmtl ")]
                                  elif ext in {".png", ".jpg", ".jpeg", ".webp"}:
                                      im = Image.open(io.BytesIO(data))
                                      entry["image"] = {"width": im.width, "height": im.height, "mode": im.mode, "format": im.format}
                              except Exception as e:
                                  entry["inspection_error"] = str(e)[:240]
                          result["entries"].append(entry)
              except Exception as e:
                  result["archive_error"] = str(e)[:400]
              return result

          for path in sorted(p for p in Path(".").iterdir() if p.is_file() and p.suffix.lower() in {".zip", ".usdz"}):
              raw = path.read_bytes()
              item = inspect_zip(path.name, raw)
              item["sha256"] = hashlib.sha256(raw).hexdigest()
              report["archives"].append(item)

          Path("asset-audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          with open("asset-audit-summary.txt", "w", encoding="utf-8") as f:
              f.write("RECURSIVE ASSET AUDIT - READ ONLY\n\n")
              def summary(item):
                  f.write(f'{item["archive"]}: {item.get("entry_count", 0)} arquivos; formatos: ' +
                          ", ".join(f'{k}={v}' for k,v in sorted(item.get("formats", {}).items())) + "\n")
                  for e in item.get("entries", []):
                      if "nested_archive" in e: summary(e["nested_archive"])
                      if e.get("obj_stats"): f.write("  OBJ " + e["path"] + ": " + str(e["obj_stats"]) + "\n")
                      if e.get("glb"): f.write("  GLB " + e["path"] + ": " + str(e["glb"]) + "\n")
                      if e.get("blend_header"): f.write("  BLEND " + e["path"] + ": " + e["blend_header"] + "\n")
                      if e.get("image"): f.write("  IMG " + e["path"] + ": " + str(e["image"]) + "\n")
                  if item.get("archive_error"): f.write("  ERRO: " + item["archive_error"] + "\n")
              for a in report["archives"]:
                  summary(a)
                  f.write("\n")
          PY

      - name: Upload recursive audit report
        uses: actions/upload-artifact@v4
        with:
          name: freefire3d-recursive-asset-audit
          path: |
            asset-audit.json
            asset-audit-summary.txt
          if-no-files-found: error
          retention-days: 7
