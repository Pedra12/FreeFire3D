name: Asset audit

on:
  push:
    paths:
      - ".github/workflows/asset-audit.yml"
      - "docs/asset-audit-trigger.md"
      - "*.zip"
      - "*.usdz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect asset archives without changing originals
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, hashlib, struct
          from pathlib import Path

          report = {"notice": "Read-only audit. Original repository assets are not modified.", "archives": []}
          for path in sorted(p for p in Path(".").iterdir() if p.is_file() and p.suffix.lower() in {".zip", ".usdz"}):
              item = {"archive": path.name, "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "entries": [], "entry_count": 0, "total_uncompressed_bytes": 0, "formats": {}}
              try:
                  with zipfile.ZipFile(path) as z:
                      infos = [i for i in z.infolist() if not i.is_dir()]
                      item["entry_count"] = len(infos)
                      item["total_uncompressed_bytes"] = sum(i.file_size for i in infos)
                      for info in infos:
                          ext = Path(info.filename).suffix.lower() or "[no extension]"
                          item["formats"][ext] = item["formats"].get(ext, 0) + 1
                          entry = {"path": info.filename, "bytes": info.file_size, "compressed_bytes": info.compress_size}
                          if ext in {".obj", ".gltf", ".glb", ".fbx", ".dae", ".mtl", ".png", ".jpg", ".jpeg", ".webp", ".tga", ".ktx", ".dds"}:
                              try:
                                  data = z.read(info)
                                  if ext == ".obj":
                                      lines = data[:12000000].decode("utf-8", "replace").splitlines()
                                      entry["obj_stats"] = {k: sum(1 for line in lines if line.startswith(prefix)) for k,prefix in
                                                            [("vertices","v "),("uvs","vt "),("normals","vn "),("faces","f ")]}
                                  elif ext == ".gltf":
                                      d = json.loads(data.decode("utf-8-sig"))
                                      entry["gltf"] = {"asset": d.get("asset", {}), "scenes": len(d.get("scenes", [])),
                                                       "nodes": len(d.get("nodes", [])), "meshes": len(d.get("meshes", [])),
                                                       "materials": len(d.get("materials", [])), "textures": len(d.get("textures", [])),
                                                       "images": d.get("images", []), "buffers": d.get("buffers", [])}
                                  elif ext == ".glb" and len(data) >= 12:
                                      entry["glb_version"] = struct.unpack("<I", data[4:8])[0]
                                      entry["glb_declared_length"] = struct.unpack("<I", data[8:12])[0]
                                  elif ext == ".fbx":
                                      entry["fbx_header"] = data[:32].decode("latin1", "replace")
                                  elif ext == ".dae":
                                      entry["dae_has_geometry"] = b"<geometry" in data[:2000000]
                                  elif ext == ".mtl":
                                      entry["mtl_materials"] = [s.strip() for s in data.decode("utf-8", "replace").splitlines() if s.startswith("newmtl ")]
                                  elif ext in {".png", ".jpg", ".jpeg"}:
                                      try:
                                          from PIL import Image
                                          import io
                                          im = Image.open(io.BytesIO(data))
                                          entry["image"] = {"width": im.width, "height": im.height, "mode": im.mode}
                                      except Exception as e:
                                          entry["image_inspection"] = str(e)[:160]
                              except Exception as e:
                                  entry["inspection_error"] = str(e)[:240]
                          item["entries"].append(entry)
              except Exception as e:
                  item["archive_error"] = str(e)[:400]
              report["archives"].append(item)

          Path("asset-audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          with open("asset-audit-summary.txt", "w", encoding="utf-8") as f:
              f.write("ASSET AUDIT - READ ONLY\n\n")
              for a in report["archives"]:
                  f.write(f'{a["archive"]}: {a.get("entry_count", 0)} arquivos; {a.get("total_uncompressed_bytes", 0)} bytes descompactados\n')
                  f.write("Formatos: " + ", ".join(f'{k}={v}' for k,v in sorted(a.get("formats", {}).items())) + "\n")
                  if a.get("archive_error"): f.write("ERRO: " + a["archive_error"] + "\n")
                  f.write("\n")
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: freefire3d-asset-audit
          path: |
            asset-audit.json
            asset-audit-summary.txt
          if-no-files-found: error
          retention-days: 7
