name: Texture recovery preview

on:
  push:
    paths:
      - ".github/workflows/texture-recovery-preview.yml"
      - "docs/texture-recovery-trigger.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1
      - name: Extract all model and texture files
        run: |
          mkdir -p /tmp/assets audit/previews audit/logs
          python3 - <<'PY'
          import zipfile,io,pathlib,re
          root=pathlib.Path('/tmp/assets')
          def walk(label,raw,depth=0):
            try:
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                for i in z.infolist():
                  if i.is_dir(): continue
                  e=pathlib.Path(i.filename).suffix.lower(); data=z.read(i)
                  if e=='.zip' and depth<5: walk(label+'_'+pathlib.Path(i.filename).name,data,depth+1)
                  elif e in ('.blend','.obj','.mtl','.gltf','.glb','.fbx','.png','.jpg','.jpeg','.webp','.tga'):
                    q=root/(re.sub(r'[^A-Za-z0-9_.-]+','_',label+'_'+i.filename))
                    q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(data)
            except Exception as ex: print('EXTRACT_ERROR',label,str(ex)[:200])
          for p in pathlib.Path('.').iterdir():
            if p.suffix.lower()=='.zip': walk(p.stem,p.read_bytes())
          print('Extracted',sum(1 for p in root.rglob('*') if p.is_file()),'asset files')
          PY
      - name: Reconnect textures and render
        shell: bash
        run: |
          cat > /tmp/texture_preview.py <<'PY'
          import bpy, json, os, pathlib, traceback
          from mathutils import Vector
          from pathlib import Path
          root=Path('/tmp/assets')
          image_files={}
          for p in root.rglob('*'):
            if p.is_file() and p.suffix.lower() in ('.png','.jpg','.jpeg','.webp','.tga'):
              image_files.setdefault(p.name.lower(),[]).append(p)
          results={'texture_files':sum(map(len,image_files.values())),'blend_scenes':[]}
          for image in bpy.data.images:
            if image.source=='FILE':
              name=Path(image.filepath).name.lower()
              candidates=image_files.get(name,[]) or [p for p in root.rglob('*') if p.is_file() and p.name.lower().endswith('_'+name)]
              if candidates:
                image.filepath=str(candidates[0]); image.reload()
          scene=bpy.context.scene
          meshes=[o for o in scene.objects if o.type=='MESH']; pts=[]
          for o in meshes: pts += [o.matrix_world @ Vector(c) for c in o.bound_box]
          mats=[]
          for m in bpy.data.materials:
            links=[]
            if m.use_nodes and m.node_tree:
              for n in m.node_tree.nodes:
                if n.type=='TEX_IMAGE' and n.image:
                  links.append({'image':n.image.name,'path':n.image.filepath,'loaded':n.image.has_data,'size':list(n.image.size)})
            mats.append({'name':m.name,'images':links})
          item={'file':bpy.data.filepath,'mesh_objects':len(meshes),'materials':mats}
          if pts:
            lo=Vector([min(getattr(p,a) for p in pts) for a in 'xyz']); hi=Vector([max(getattr(p,a) for p in pts) for a in 'xyz']); center=(lo+hi)*.5; span=max((hi-lo).length,1)
            cd=bpy.data.cameras.new('PreviewCamera'); cam=bpy.data.objects.new('PreviewCamera',cd); scene.collection.objects.link(cam)
            cam.location=center+Vector((1.4,-1.8,1.35)).normalized()*span*1.8; cam.rotation_euler=(center-cam.location).to_track_quat('-Z','Y').to_euler(); cd.lens=50; scene.camera=cam
            ld=bpy.data.lights.new('PreviewKey','AREA'); lamp=bpy.data.objects.new('PreviewKey',ld); scene.collection.objects.link(lamp); lamp.location=center+Vector((0,-span,span*1.3)); ld.energy=max(span*span*8,1500); ld.size=span*.7
            scene.render.engine='BLENDER_EEVEE'
            scene.render.resolution_x=1280; scene.render.resolution_y=960; scene.render.resolution_percentage=65; scene.render.image_settings.file_format='PNG'
            scene.render.filepath=os.path.abspath('audit/previews/'+Path(bpy.data.filepath).stem+'_textured.png')
            try: bpy.ops.render.render(write_still=True); item['preview']=scene.render.filepath
            except Exception as e: item['render_error']=str(e); item['traceback']=traceback.format_exc()[-2000:]
          results['blend_scenes'].append(item)
          Path('audit/'+Path(bpy.data.filepath).stem+'_textures.json').write_text(json.dumps(item,indent=2),encoding='utf8')
          PY
          for f in /tmp/assets/*hh.blend /tmp/assets/*CLOCKTOWER*.blend; do
            [ -f "$f" ] || continue
            blender -b "$f" --python /tmp/texture_preview.py > "audit/logs/$(basename "$f").log" 2>&1 || echo "BLENDER_FAILED:$f" >> audit/logs/failures.txt
          done
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('audit/texture-file-index.json')
          from collections import Counter
          names=[]
          for f in pathlib.Path('/tmp/assets').rglob('*'):
            if f.is_file() and f.suffix.lower() in ('.png','.jpg','.jpeg','.webp','.tga'): names.append(f.name)
          p.write_text(json.dumps({'image_count':len(names),'filenames':names},indent=2),encoding='utf8')
          for f in pathlib.Path('audit').glob('*_textures.json'):
            d=json.loads(f.read_text()); refs=[im for m in d.get('materials',[]) for im in m.get('images',[])]
            print(f.name,'meshes',d.get('mesh_objects'),'images',len(refs),'loaded',sum(x['loaded'] for x in refs))
          PY
      - name: Upload texture preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freefire3d-texture-recovery-preview
          path: audit/
          if-no-files-found: warn
          retention-days: 7
