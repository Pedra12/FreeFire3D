name: Prepare CC0 humanoid animation library

on:
  push:
    branches:
      - unity-project
    paths:
      - "Tools/fetch_quaternius_animations.py"
      - ".github/workflows/prepare-quaternius-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Unity project
        uses: actions/checkout@v4
      - name: Download and validate official Quaternius Standard pack
        run: python3 Tools/fetch_quaternius_animations.py
      - name: Commit one in-place animation library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SourceArchives/quaternius-universal-animation-library-standard.zip Assets/Game/Animations/Quaternius/
          if ! git diff --cached --quiet; then
            git commit -m "Add canonical CC0 humanoid animation library"
            for attempt in 1 2 3; do
              git fetch origin unity-project
              git rebase origin/unity-project
              if git push origin HEAD:unity-project; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
